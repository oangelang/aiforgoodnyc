<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — AI for Good NYC</title>
<meta name="description" content="Get in touch with AI for Good NYC. We'd love to hear from you.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://aiforgoodnyc.org/contact">
<meta property="og:title" content="Contact — AI for Good NYC">
<meta property="og:description" content="Get in touch with AI for Good NYC. We'd love to hear from you.">
<meta property="og:image" content="https://aiforgoodnyc.org/assets/images/hero-sky.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'DM Sans', system-ui, sans-serif; background: #FFFDF8; color: #7A4830; -webkit-font-smoothing: antialiased; overflow-x: hidden; }

nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: 62px; padding: 0 52px;
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(255,253,248,0.88); backdrop-filter: blur(16px);
  border-bottom: 0.5px solid rgba(250,208,122,0.4);
}
.logo-type { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600; color: #A85E0A; text-decoration: none; }
.logo-type b { font-weight: 700; color: #D9695C; }
.nav-right { display: flex; align-items: center; gap: 28px; }
.nav-link { font-size: 11.5px; font-weight: 700; color: #8C6050; text-decoration: none; letter-spacing: 0.08em; text-transform: uppercase; transition: color 0.2s; }
.nav-link:hover { color: #D9891A; }
.nav-link.active { color: #C87010; }

/* HERO */
.contact-hero { position: relative; min-height: 40vh; display: flex; align-items: center; justify-content: center; text-align: center; overflow: hidden; }
.contact-hero-bg { position: absolute; inset: 0; background-image: url('../assets/images/sun-water.png'); background-size: cover; background-position: center; }
.contact-hero-bg::after { content: ''; position: absolute; inset: 0; background: rgba(255,248,225,0.55); }
.contact-hero-inner { position: relative; z-index: 1; max-width: 600px; padding: 120px 24px 50px; }
.contact-kicker { font-size: 10px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #C87A10; margin-bottom: 18px; }
.contact-h1 { font-family: 'Space Grotesk', sans-serif; font-size: clamp(34px, 5vw, 52px); font-weight: 700; line-height: 1.1; color: #5C1E04; letter-spacing: -0.02em; margin-bottom: 14px; }
.contact-subtitle { font-size: 15px; color: #8A5830; line-height: 1.7; }

/* FORM */
.contact-form-section { max-width: 580px; margin: 0 auto; padding: 64px 52px 80px; }
.contact-form { display: flex; flex-direction: column; gap: 20px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-label { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #B07040; }
.form-input, .form-textarea {
  font-family: 'DM Sans', sans-serif; font-size: 15px; color: #5C2E0A;
  background: rgba(255,253,248,0.96); border: 1.5px solid rgba(220,150,40,0.4);
  border-radius: 10px; padding: 14px 18px; outline: none; transition: border-color 0.2s;
}
.form-input:focus, .form-textarea:focus { border-color: #F0A820; }
.form-input::placeholder, .form-textarea::placeholder { color: #C8A070; }
.form-textarea { min-height: 160px; resize: vertical; line-height: 1.6; }
.form-submit {
  background: #5C1E04; color: #FEF6E4; font-family: 'DM Sans', sans-serif;
  font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 16px 32px; border-radius: 10px; border: none; cursor: pointer;
  transition: background 0.2s, transform 0.15s; align-self: flex-start;
}
.form-submit:hover { background: #7A2E0A; transform: translateY(-1px); }

/* FOOTER */
footer { position: relative; overflow: hidden; border-top: 1px solid rgba(220,160,60,0.3); padding: 40px 52px; }
.footer-bg { position: absolute; inset: 0; background-image: url('../assets/images/copper-mesh.png'); background-size: cover; opacity: 0.06; }
.footer-inner { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; }
.footer-logo-type { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600; color: #A85E0A; }
.footer-logo-type b { font-weight: 700; color: #D9695C; }
.footer-links { display: flex; gap: 22px; flex-wrap: wrap; }
.footer-links a { font-size: 11.5px; font-weight: 500; color: #A88060; text-decoration: none; transition: color 0.2s; }
.footer-links a:hover { color: #C87010; }
.footer-copy { font-size: 10.5px; color: #C8A070; }

@keyframes fadeUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
.contact-kicker { animation: fadeUp 0.5s ease both; }
.contact-h1 { animation: fadeUp 0.55s 0.08s ease both; }
.contact-subtitle { animation: fadeUp 0.55s 0.16s ease both; }

@media (max-width: 860px) {
  nav { padding: 0 22px; }
  .contact-hero-inner { padding: 100px 22px 40px; }
  .contact-form-section { padding: 48px 22px 64px; }
  footer { padding: 30px 22px; }
}

/* MOBILE NAV */
.nav-toggle { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 6px; z-index: 101; }
.nav-toggle span { display: block; width: 22px; height: 2px; background: #8C6050; border-radius: 1px; transition: all 0.3s; }
.nav-toggle.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
.nav-toggle.active span:nth-child(2) { opacity: 0; }
.nav-toggle.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

@media (max-width: 640px) {
  .nav-toggle { display: flex; }
  .nav-right {
    display: none; position: fixed; top: 62px; left: 0; right: 0;
    flex-direction: column; align-items: flex-start; gap: 0;
    background: rgba(255,253,248,0.97); backdrop-filter: blur(20px);
    padding: 12px 0; border-bottom: 1px solid rgba(250,208,122,0.4);
    box-shadow: 0 8px 32px rgba(92,30,4,0.08);
  }
  .nav-right.open { display: flex; }
  .nav-right .nav-link {
    display: block; width: 100%; padding: 14px 24px;
    font-size: 13px; letter-spacing: 0.06em;
  }
  .nav-right .nav-link:hover { background: rgba(253,232,160,0.3); }

  .footer-inner { flex-direction: column; align-items: flex-start; gap: 16px; }
  .footer-links { flex-wrap: wrap; gap: 14px 18px; }
  .logo-type { font-size: 17px; }
}

</style>
</head>
<body>

<nav>
  <a href="/" class="logo-type">AI for <b>Good</b> NYC</a>
    <button class="nav-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
  <div class="nav-right">
    <a href="/#proof" class="nav-link">Our Work</a>
    <a href="/framework" class="nav-link">Framework</a>
    <a href="/#events" class="nav-link">Events</a>
    <a href="/about" class="nav-link">About</a>
    <a href="/#join" class="nav-link">Join</a>
  </div>
</nav>

<!-- HERO -->
<section class="contact-hero">
  <div class="contact-hero-bg"></div>
  <div class="contact-hero-inner">
    <div class="contact-kicker">Get in touch</div>
    <h1 class="contact-h1">We'd love to hear from you.</h1>
    <p class="contact-subtitle">Want to refine the framework, get involved, ask a question, or just say hello? Drop us a note.</p>
  </div>
</section>

<!-- FORM -->
<section class="contact-form-section">
  <form class="contact-form" action="https://formspree.io/f/xgoqpapb" method="POST">
    <div class="form-group">
      <label class="form-label" for="name">Name</label>
      <input class="form-input" type="text" id="name" name="name" placeholder="Your name" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input class="form-input" type="email" id="email" name="email" placeholder="you@example.com" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="message">What's on your mind?</label>
      <textarea class="form-textarea" id="message" name="message" placeholder="Tell us how you want to get involved, suggest changes to the framework, ask us something, or share what you're working on."></textarea>
    </div>
    <button class="form-submit" type="submit">Send Message</button>
  </form>
</section>

<footer>
  <div class="footer-bg"></div>
  <div class="footer-inner">
    <div class="footer-logo-type">AI for <b>Good</b> NYC</div>
    <div class="footer-links">
      <a href="/#proof">Our Work</a>
      <a href="/framework">Framework</a>
      <a href="/#events">Events</a>
      <a href="/about">About</a>
      <a href="https://chat.whatsapp.com/FUOT9wJdj7q9mhJ7PyxiX3?mode=gi_t" target="_blank">WhatsApp</a>
      <a href="/contact">Contact</a>
    </div>
    <div class="footer-copy">&copy; 2026</div>
  </div>
</footer>


<script>
document.querySelector('.nav-toggle').addEventListener('click', function() {
  this.classList.toggle('active');
  document.querySelector('.nav-right').classList.toggle('open');
});
// Close menu when a link is clicked
document.querySelectorAll('.nav-right .nav-link').forEach(link => {
  link.addEventListener('click', () => {
    document.querySelector('.nav-toggle').classList.remove('active');
    document.querySelector('.nav-right').classList.remove('open');
  });
});
</script>

</body>
</html>
